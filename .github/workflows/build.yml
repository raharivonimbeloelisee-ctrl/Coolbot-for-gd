name: Build AutoBot
on: workflow_dispatch

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [Android32, Android64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dezipper le projet
        run: |
          unzip -o AutoBot.zip
          cp -a gd-bot/. .
          rm -rf gd-bot
          sed -i 's/"geode": "4.0.0"/"geode": "5.10.1"/; s/"android": "2.2074"/"android": "*"/' mod.json
      - name: Installer le NDK 28
        run: |
          ls $ANDROID_HOME/ndk
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"
          ls $ANDROID_HOME/ndk
      - uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.target }}
          sdk: latest
          android-ndk-version: 28.2.13676358

  package:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: combine
      - uses: actions/upload-artifact@v4
        with:
          name: AutoBot
          path: ${{ steps.combine.outputs.build-output }}
