name: Build AutoBot
on: workflow_dispatch

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [Android32, Android64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dezipper le projet
        run: |
          unzip -o AutoBot.zip
          cp -a gd-bot/. .
          rm -rf gd-bot
          sed -i 's/"geode": "4.0.0"/"geode": "5.11.2"/; s/"android": "2.2074"/"android": "*"/' mod.json
          sed -i 's/void processCommands(float dt) {/void processCommands(float dt, bool isHalfTick, bool isLastTick) {/; s/GJBaseGameLayer::processCommands(dt);/GJBaseGameLayer::processCommands(dt, isHalfTick, isLastTick);/; s/G::enabled() \&\& m_player1/G::enabled() \&\& !isHalfTick \&\& m_player1/' src/main.cpp
      - uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.target }}
          sdk: latest

  package:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: combine
      - uses: actions/upload-artifact@v4
        with:
          name: AutoBot
          path: ${{ steps.combine.outputs.build-output }}
